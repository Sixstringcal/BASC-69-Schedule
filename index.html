<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bay Area Speedcubin' 69 2026 - Schedule</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading competition data...</p>
    </div>

    <header class="header">
        <div class="container">
            <h1 class="comp-title" id="compTitle">Loading...</h1>
            <p class="comp-dates" id="compDates"></p>
            <p class="comp-venue" id="compVenue"></p>
            <div class="user-section" id="userSection"></div>
        </div>
    </header>

    <main class="main">
        <section class="info-section">
            <div class="container">
                <div class="info-cards">
                    <div class="info-card">
                        <h3>Competition Dates</h3>
                        <p id="dateInfo"></p>
                    </div>
                    <div class="info-card">
                        <h3>Venue</h3>
                        <p id="venueInfo"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Navigation Tabs -->
        <section class="nav-tabs-section">
            <div class="container">
                <div class="nav-tabs">
                    <button class="nav-tab active" data-tab="schedule">Schedule</button>
                    <button class="nav-tab" data-tab="groups">Group Selection</button>
                    <button class="nav-tab" data-tab="roomBlocks">Room Blocks</button>
                    <button class="nav-tab" data-tab="panels">Panel Signups</button>
                    <button class="nav-tab" data-tab="tshirt">T-Shirt Size</button>
                    <button class="nav-tab" id="adminTabBtn" data-tab="admin" style="display: none;">Admin</button>
                </div>
            </div>
        </section>

        <!-- Schedule Tab -->
        <section class="tab-content active" id="scheduleTab">
            <div class="container">
                <h2>Competition Schedule</h2>
                <div class="day-tabs" id="dayTabs"></div>
                <div class="room-legend" id="roomLegend"></div>
                <div class="schedule-grid" id="scheduleGrid"></div>
            </div>
        </section>

        <!-- Group Selection Tab -->
        <section class="tab-content" id="groupsTab">
            <div class="container">
                <h2>Group Selection</h2>
                <div id="groupsContent"></div>
            </div>
        </section>

        <!-- Room Blocks Tab -->
        <section class="tab-content" id="roomBlocksTab">
            <div class="container">
                <h2>Room Blocks</h2>
                <div id="roomBlocksContent"></div>
            </div>
        </section>

        <!-- Panel Signups Tab -->
        <section class="tab-content" id="panelsTab">
            <div class="container">
                <h2>Panel Signups</h2>
                <div id="panelsContent"></div>
            </div>
        </section>

        <!-- T-Shirt Size Tab -->
        <section class="tab-content" id="tshirtTab">
            <div class="container">
                <h2>T-Shirt Size Selection</h2>
                <div id="tshirtContent"></div>
            </div>
        </section>

        <!-- Admin Tab -->
        <section class="tab-content" id="adminTab">
            <div class="container">
                <h2>Admin: Group Management</h2>
                <div id="adminContent"></div>
            </div>
        </section>

    </main>

    <!-- Info Modal -->
    <div class="modal" id="infoModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Bay Area Speedcubin' 69 | Unofficial fan site | <a href="privacy.html">Privacy Policy &amp; Terms</a></p>
            <p>Data from <a href="https://www.worldcubeassociation.org/" target="_blank">World Cube Association</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="groups.js"></script>
    <script>
        // Initialize both schedule and group selection
        document.addEventListener('DOMContentLoaded', () => {
            initGroupSelection();
        });
    </script>
</body>
</html>
